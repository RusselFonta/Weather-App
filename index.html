<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <!-- importing fonts from google -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/png" href="asset/image/sun.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main-container">
        <header class="search-section">
            <label for="city-input" class="hidden"></label>
            <span class="combine-group">
                <input type="text" class="search-city" id="city-input" placeholder="search city">
                <button class="search-btn" aria-label="Search city">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </span>
        </header>
        <section class="weather-box" style="display: none;">
            <section class="weather-info">
                <div class="actual-location-date">
                    <div class="location">
                        <span class="material-symbols-outlined">location_on</span>
                        <h1 class="location-name"></h1>
                    </div>
                    <span class="actual-date"></span>
                </div>
            </section>

            <section class="weather-image">
                <img src="#" alt="weather condition icon" class="weather-icon">
                <div class="container-info">
                    <h5 class="temperature"></h5>
                    <p class="weather-descript"></p>
                </div>
            </section>

            <section class="additon-info">
                <div class="humidity-cart">
                    <span class="material-symbols-outlined" title="humidity">cool_to_dry</span>
                    <h4 class="humidity"></h4>
                </div>
                <div class="wind-cart">
                    <span class="material-symbols-outlined" title="wind-speed">air</span>
                    <h4 class="wind-speed"></h4>
                </div>
                <div class="light-cart">
                    <span class="material-symbols-outlined" title="sunset">brightness_5</span>
                    <h4 class="sunset"></h4>
                </div>
            </section>

            <div class="enviromental-condition"></div>

            <section class="five-day-weather">
                <div class="first-day"></div>
                <div class="first-day"></div>
                <div class="first-day"></div>
                <div class="first-day"></div>
                <div class="first-day"></div>
            </section>
        </section>

        <section class="error-part" style="display: none;">
            <div class="error-image-wrapper">
                <img src="asset/image/error.webp" alt="cloudy error message">
            </div>
            <h2 class="error-message">Error found</h2>
            <p class="error-text">An error has been found please check the city spelling and the internet connection and try again</p>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>

</html>
